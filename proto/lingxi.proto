/**
 * @file lingxi.proto
 * @brief 灵犀 IM 通信协议 v0（M0 定稿基线，随里程碑演进，规则见 docs/02 §7）。
 *
 * 编号规范：字段只增不改不删；消息 ID 分配表见 docs/02-通信协议设计.md §2。
 */
syntax = "proto3";
package lingxi;

/* ========== 登录鉴权（msgId 0x01xx） ========== */

/**
 * @brief 登录请求：token 由 GateServer 登录接口下发。
 */
message LoginRequest {
  int64  uid            = 1;  ///< 用户 ID
  string token          = 2;  ///< 访问令牌（HMAC，docs/02 §6）
  string device_id      = 3;  ///< 设备标识（顶号判定依据）
  string client_version = 4;  ///< 客户端版本号
}

/**
 * @brief 登录响应。
 */
message LoginResponse {
  int32  err_code    = 1;  ///< 0 成功；401 token 失效；403 顶号踢出
  string err_msg     = 2;  ///< 错误描述
  int64  server_time = 3;  ///< 服务器毫秒时间戳（客户端校时）
}

/**
 * @brief 顶号通知：同账号他处登录，强制下线。
 */
message KickNotice {
  string device_id  = 1;  ///< 新登录设备标识
  string login_ip   = 2;  ///< 新登录 IP
  int64  login_time = 3;  ///< 新登录时间戳（毫秒）
}

/* ========== 消息收发（msgId 0x03xx，单聊/群聊/AI 通用） ========== */

/**
 * @brief 消息类型枚举（与 JSON 信封结构一一对应，docs/02 §3.2）。
 */
enum MsgType {
  MSG_NONE      = 0;  ///< 占位（proto3 首枚举必须为 0）
  MSG_TEXT      = 1;  ///< 文本
  MSG_IMAGE     = 2;  ///< 图片
  MSG_VOICE     = 3;  ///< 语音
  MSG_VIDEO     = 4;  ///< 视频
  MSG_FILE      = 5;  ///< 文件（word/pdf/md 等）
  MSG_SYSTEM    = 6;  ///< 系统消息
  MSG_NARRATION = 7;  ///< 剧情旁白（酒馆，from_uid=0）
  MSG_CARD      = 8;  ///< 角色卡名片（酒馆）
  MSG_OOC       = 9;  ///< 玩家 OOC 发言（酒馆剧情群）
}

/**
 * @brief 通用消息体。
 */
message MsgBody {
  int64  conv_id       = 1;  ///< 会话 ID（服务端分配的雪花 ID）
  int64  from_uid      = 2;  ///< 发送者 uid（旁白=0）
  int64  conv_seq      = 3;  ///< 服务端分配的会话内单调递增序号（客户端发送时=0）
  string client_msg_id = 4;  ///< 客户端幂等 ID（UUID）
  int32  msg_type      = 5;  ///< MsgType 枚举值
  int64  send_time_ms  = 6;  ///< 发送毫秒时间戳
  bytes  payload       = 7;  ///< JSON 信封（按 msg_type 解释）
  int32  status        = 8;  ///< 0 正常；1 已撤回；2 生成中(AI)；3 被截断
  int64  to_uid        = 9;  ///< 单聊对端 uid（conv_id 未建时用于定位/建会话）
  int64  group_id      = 10; ///< 群聊群 ID（=conv_id，单聊为 0）
  int64  msg_id        = 11; ///< 服务端雪花 ID（撤回/引用寻址）
}

/**
 * @brief 会话列表项。
 */
message ConversationInfo {
  int64  conv_id       = 1;  ///< 会话 ID
  int32  type          = 2;  ///< 1 单聊 2 群聊 3 AI单聊 4 剧情群
  int64  peer_uid      = 3;  ///< 单聊对端 uid（群聊为 0）
  string peer_nickname = 4;  ///< 对端昵称/群名
  int64  last_seq      = 5;  ///< 会话最新 seq
  int64  last_read_seq = 6;  ///< 我的已读游标（unread = last_seq - last_read_seq）
  int64  last_msg_time_ms = 7; ///< 最近消息时间
  string last_preview  = 8;  ///< 最近消息预览（服务端截取）
}

/**
 * @brief 会话列表请求（methodId 0x030A）。
 */
message ConversationListRequest {
  // M2 无参数；预留分页字段
}

/**
 * @brief 会话列表响应。
 */
message ConversationListResponse {
  repeated ConversationInfo conversations = 1;
}

/**
 * @brief 已读上报（0x0304）。
 */
message MessageReadAck {
  int64 conv_id      = 1;  ///< 会话 ID
  int64 last_read_seq = 2; ///< 已读到的 seq
}

/**
 * @brief 对端已读通知（0x0305）。
 */
message MessageReadNotice {
  int64 conv_id       = 1;
  int64 peer_uid      = 2;  ///< 已读方
  int64 last_read_seq = 3;
}

/**
 * @brief 撤回请求（0x0306）：仅发送者本人、2 分钟内（docs/02 §4）。
 */
message MessageRecallRequest {
  int64 conv_id = 1;
  int64 msg_id  = 2;  ///< 目标消息雪花 ID
}

/**
 * @brief 撤回通知（0x0307，广播给会话成员）。
 */
message MessageRecallNotice {
  int64 conv_id     = 1;
  int64 msg_id      = 2;
  int64 operator_uid = 3;
}

/**
 * @brief 消息发送请求。
 */
message MessageSendRequest {
  MsgBody body = 1;  ///< 消息体
}

/**
 * @brief 消息发送确认：服务端落库成功后回执。
 */
message MessageAck {
  int32  err_code     = 1;  ///< 0 成功；非 0 见 err_msg
  string err_msg      = 2;  ///< 错误描述
  int64  conv_id      = 3;  ///< 会话 ID
  string client_msg_id = 4; ///< 与请求对应的幂等 ID
  int64  conv_seq     = 5;  ///< 服务端分配的会话序号
  int64  send_time_ms = 6;  ///< 服务器接收时间戳
}

/**
 * @brief 新消息推送。
 */
message MessageNotify {
  MsgBody body = 1;  ///< 完整消息体
}

/**
 * @brief 会话已读游标。
 */
message ConvCursor {
  int64 conv_id  = 1;  ///< 会话 ID
  int64 last_seq = 2;  ///< 本地已连续收到的最大 seq
}

/**
 * @brief 漫游同步请求：客户端上报各会话本地最大连续 seq。
 */
message SyncRequest {
  repeated ConvCursor cursors = 1;  ///< 每个活跃会话一条
}

/**
 * @brief 漫游同步响应（分页）。
 */
message SyncResponse {
  repeated MsgBody messages = 1;  ///< 差量消息批
  bool  has_more            = 2;  ///< 是否还有更多
  int64 next_cursor         = 3;  ///< 下一页服务端游标
}

/* ========== 音视频通话信令（msgId 0x06xx，docs/05） ========== */

/**
 * @brief 通话邀请（主叫携带预协商 SDP Offer）。
 */
message CallInviteRequest {
  string call_id    = 1;  ///< 通话唯一 ID（主叫生成 UUID）
  int64  callee_uid = 2;  ///< 被叫 uid
  int32  media_type = 3;  ///< 1 音频 2 视频
  string offer_sdp  = 4;  ///< SDP Offer
}

/**
 * @brief 通话接听（被叫回 SDP Answer）。
 */
message CallAcceptRequest {
  string call_id   = 1;   ///< 通话唯一 ID
  string answer_sdp = 2;  ///< SDP Answer
}

/**
 * @brief ICE 候选中转（双方经 ChatServer 交换）。
 */
message CallIceCandidate {
  string call_id     = 1;  ///< 通话唯一 ID
  string candidate   = 2;  ///< ICE candidate 文本
  string mid         = 3;  ///< 媒体行标识
}

/* ========== 酒馆流式与重掷（msgId 0x07xx，docs/04） ========== */

/**
 * @brief AI 流式分片。
 */
message AiStreamChunkNotice {
  int64  conv_id    = 1;  ///< 会话 ID
  int64  target_seq = 2;  ///< 本条 AI 消息预占的会话 seq（生成完成前 status=2）
  string delta_text = 3;  ///< 增量文本
}

/**
 * @brief AI 流式结束：最终全文权威重写（docs/02 R7）。
 */
message AiStreamEndNotice {
  int64  conv_id        = 1;  ///< 会话 ID
  int64  target_seq     = 2;  ///< 目标消息 seq
  string final_text     = 3;  ///< 最终全文（分片可能乱序/丢失，以本字段为准）
  int32  finish_reason  = 4;  ///< 0 stop 1 length 2 error-truncated
  int32  affinity_delta = 5;  ///< 好感度增量（docs/04 §8）
}

/**
 * @brief AI 生成失败通知。
 */
message AiStreamErrorNotice {
  int64  conv_id    = 1;  ///< 会话 ID
  int64  target_seq = 2;  ///< 目标消息 seq
  string err_msg    = 3;  ///< 用户可读的兜底文案
}

/**
 * @brief Swipe 重掷请求（docs/04 §10）。
 */
message AiSwipeRequest {
  int64 conv_id = 1;  ///< 会话 ID
  int64 conv_seq = 2; ///< 目标 AI 消息 seq
  int32 action  = 3;  ///< 0 重新生成 1 下一版本 2 上一版本
}

/* ========== 内部服务治理（serviceId=0x01 StatusServer，docs/01 §4.4） ========== */

/**
 * @brief 服务类型枚举。
 */
enum ServerType {
  SERVER_NONE   = 0;  ///< 占位
  SERVER_GATE   = 1;  ///< 接入网关
  SERVER_STATUS = 2;  ///< 注册中心
  SERVER_CHAT   = 3;  ///< 消息核心节点
  SERVER_FILE   = 4;  ///< 文件节点
  SERVER_AI     = 5;  ///< 酒馆节点
}

/**
 * @brief 服务注册请求：服务启动时上报自身信息（methodId=0x01）。
 */
message RegisterRequest {
  int32  server_type = 1;  ///< ServerType
  int32  server_id   = 2;  ///< 实例编号（多实例间互异）
  string rpc_host    = 3;  ///< RPC 监听地址
  int32  rpc_port    = 4;  ///< RPC 监听端口
  string client_host = 5;  ///< 面向客户端的地址（chat 类型使用）
  int32  client_port = 6;  ///< 面向客户端的端口（chat 类型使用）
  int32  load        = 7;  ///< 当前负载（chat 为连接数）
}

/**
 * @brief 服务注册响应。
 */
message RegisterResponse {
  int32  err_code = 1;  ///< 0 成功
  string err_msg  = 2;
}

/**
 * @brief 心跳请求：30s 周期，3 次未收到则摘除（methodId=0x02）。
 */
message HeartbeatRequest {
  int32 server_type = 1;  ///< ServerType
  int32 server_id   = 2;  ///< 实例编号
  int32 load        = 3;  ///< 当前负载
}

/**
 * @brief 心跳响应。
 */
message HeartbeatResponse {
  int32 err_code = 1;
}

/**
 * @brief token 校验请求（ChatServer → Status，methodId=0x03）。
 */
message VerifyTokenRequest {
  int64  uid   = 1;  ///< 用户 ID
  string token = 2;  ///< HMAC 访问令牌
}

/**
 * @brief token 校验响应。
 */
message VerifyTokenResponse {
  int32 err_code = 1;  ///< 0 合法；401 失效/伪造
  string err_msg = 2;
  int64  uid     = 3;  ///< 校验通过时回填
}

/**
 * @brief ChatServer 分配请求（Gate → Status，methodId=0x04）。
 */
message AllocateChatServerRequest {
  int64 uid = 1;  ///< 待登录用户
}

/**
 * @brief ChatServer 分配响应：附带签发的访问令牌（docs/01 §5.1）。
 */
message AllocateChatServerResponse {
  int32  err_code       = 1;
  string err_msg        = 2;
  string chat_host      = 3;  ///< 客户端直连的 ChatServer 地址
  int32  chat_port      = 4;  ///< 客户端直连端口
  int32  chat_server_id = 5;  ///< 分配的实例编号
  string token          = 6;  ///< HMAC 访问令牌
  int64  token_expire_ms = 7; ///< 令牌过期时间戳
}

/* ========== ChatServer 内部方法（serviceId=0x02） ========== */

/**
 * @brief 跨节点消息推送（ChatServer → 目标 ChatServer，methodId=0x01）。
 */
message PushToUidRequest {
  int64 target_uid = 1;  ///< 目标用户
  int32 msg_id     = 2;  ///< 待下发的 IM 帧 msgId（如 0x0104 顶号）
  bytes msg_body   = 3;  ///< 待下发的 IM 帧 protobuf body
}

/**
 * @brief 推送结果。
 */
message PushToUidResponse {
  int32 err_code = 1;
  bool  online   = 2;  ///< 目标是否在本机在线
}

/* ========== 好友（msgId 0x02xx，docs/02 §2 分配表） ========== */

/**
 * @brief 用户公开资料（搜索结果/好友项通用）。
 */
message FriendProfile {
  int64  uid       = 1;  ///< 用户 ID
  string username  = 2;  ///< 用户名
  string nickname  = 3;  ///< 昵称
  string signature = 4;  ///< 个性签名
  bool   online    = 5;  ///< 是否在线（路由表判定）
  bool   is_friend = 6;  ///< 是否已是好友
  string remark    = 7;  ///< 好友备注（列表用）
  string group_name = 8;  ///< 好友分组（列表用）
}

/**
 * @brief 好友搜索（0x0201）：uid 精确 或 用户名前缀匹配。
 */
message FriendSearchRequest {
  string keyword = 1;  ///< 关键字
}

/**
 * @brief 好友搜索响应。
 */
message FriendSearchResponse {
  repeated FriendProfile users = 1;
}

/**
 * @brief 好友申请（0x0202）。
 */
message FriendApplyRequest {
  int64  to_uid    = 1;  ///< 目标用户
  string verify_msg = 2; ///< 验证消息
}

/**
 * @brief 好友申请通知（0x0203，推给被申请方）。
 */
message FriendApplyNotice {
  int64  apply_id      = 1;  ///< 申请单 ID
  int64  from_uid      = 2;  ///< 申请人
  string from_nickname = 3;  ///< 申请人昵称
  string verify_msg    = 4;  ///< 验证消息
}

/**
 * @brief 好友申请处理（0x0204）：同意/拒绝。
 */
message FriendApplyHandleRequest {
  int64 apply_id = 1;  ///< 申请单 ID
  bool  agree    = 2;  ///< true 同意 / false 拒绝
}

/**
 * @brief 申请处理结果通知（0x0205，推给申请方）。
 */
message FriendApplyResultNotice {
  int64         apply_id = 1;  ///< 申请单 ID
  bool          agree    = 2;  ///< 处理结果
  FriendProfile friend   = 3;  ///< 同意时附带对方资料（客户端直接入列表）
}

/**
 * @brief 删除好友（0x0206，双向删除）。
 */
message FriendDeleteRequest {
  int64 friend_uid = 1;  ///< 要删除的好友
}

/**
 * @brief 好友列表（0x0207）。
 */
message FriendListRequest {
  // 全量拉取；预留分页
}

/**
 * @brief 好友列表响应。
 */
message FriendListResponse {
  repeated FriendProfile friends = 1;
  int32 pending_applies = 2;  ///< 待我处理的申请数（红点）
}

/* ========== 群组（msgId 0x04xx） ========== */

/**
 * @brief 群成员信息。
 */
message GroupMemberInfo {
  int64  uid      = 1;  ///< 成员 uid
  string nickname = 2;  ///< 昵称
  int32  role     = 3;  ///< 0 群主 1 管理员 2 成员
}

/**
 * @brief 建群（0x0401）：创建者为群主，初始成员即时入群。
 */
message GroupCreateRequest {
  string name = 1;                 ///< 群名
  repeated int64 member_uids = 2;  ///< 初始成员（不含创建者）
}

/**
 * @brief 建群响应。
 */
message GroupCreateResponse {
  int32 err_code   = 1;
  string err_msg   = 2;
  int64  conv_id   = 3;  ///< 群会话 ID
}

/**
 * @brief 邀请入群（0x0402，免确认，docs/06 T30-03）。
 */
message GroupInviteRequest {
  int64 conv_id = 1;                 ///< 群会话 ID
  repeated int64 member_uids = 2;    ///< 被邀请人
}

/**
 * @brief 入群/群成员变更通知（0x0403，广播全群）。
 */
message GroupJoinNotice {
  int64 conv_id = 1;   ///< 群会话 ID
  string name   = 2;   ///< 群名
  repeated GroupMemberInfo members = 3;  ///< 变更后全量成员
}

/**
 * @brief 退群（0x0404）：群主退群需先转让或解散（M3 从简：群主不可退）。
 */
message GroupQuitRequest {
  int64 conv_id = 1;
}

/**
 * @brief 踢人（0x0405）：群主/管理员。
 */
message GroupKickRequest {
  int64 conv_id     = 1;
  int64 target_uid  = 2;
}

/**
 * @brief 解散群（0x0406）：仅群主。
 */
message GroupDissolveRequest {
  int64 conv_id = 1;
}

/**
 * @brief 群资料（0x0407）。
 */
message GroupInfoRequest {
  int64 conv_id = 1;
}

/**
 * @brief 群资料响应。
 */
message GroupInfoResponse {
  int64 conv_id = 1;
  string name   = 2;
  string announcement = 3;
  int64 owner_uid = 4;
  repeated GroupMemberInfo members = 5;
}

/**
 * @brief 通用错误应答（0x0402/0404/0405/0406 的同步回执）。
 */
message GenericErr {
  int32 err_code = 1;
  string err_msg = 2;
}

/**
 * @brief 群变更通知（0x0408：退群/踢人/解散/资料修改广播）。
 */
message GroupUpdateNotice {
  int32 action     = 1;  ///< 1 成员退出 2 成员被踢 3 群解散 4 资料修改
  int64 conv_id    = 2;
  int64 target_uid = 3;  ///< 退出/被踢者
  string name      = 4;  ///< 群名（解散后仍可用于客户端清理）
}
